syntax = "proto3";

package molva.ipc.v1;

option go_package = "github.com/udisondev/molva/proto/ipcpb";

// IPC между molvad и Electron-UI: один WebSocket, бинарные кадры.
// Каждый кадр — ровно один Frame. Первый кадр от UI — Hello с auth-токеном.

message Frame {
  oneof kind {
    Hello hello = 1;
    Command command = 2;
    Event event = 3;
  }
}

// Первое сообщение после установления соединения; токен передаётся
// molvad'у через env при спавне. Несовпадение — немедленный разрыв.
message Hello {
  bytes token = 1;
}

// Команда UI → ядро. id — корреляция с CommandResult.
message Command {
  uint64 id = 1;
  oneof kind {
    SendText send_text = 2;
    AcceptContact accept_contact = 3;
    RejectContact reject_contact = 4;
    BlockContact block_contact = 5;
    UnblockContact unblock_contact = 6;
    SetAlias set_alias = 7;
    DeleteMessage delete_message = 8;
    AddContact add_contact = 9;
    ListChats list_chats = 10;
    ListMessages list_messages = 11;
    MyInvite my_invite = 12;
    OfferFile offer_file = 13;
    CallStart call_start = 14;
    CallAccept call_accept = 15;
    CallReject call_reject = 16;
    CallHangup call_hangup = 17;
  }
}

message CallStart {
  bytes peer = 1;
}

message CallAccept {
  bytes call_id = 1;
}

message CallReject {
  bytes call_id = 1;
}

message CallHangup {
  bytes call_id = 1;
}

// Предложить контакту файл по локальному пути (путь даёт диалог оболочки).
message OfferFile {
  bytes peer = 1;
  string path = 2;
}

message SendText {
  bytes peer = 1; // NodeID
  string text = 2;
}

message AcceptContact {
  bytes peer = 1;
}

message RejectContact {
  bytes peer = 1;
}

message BlockContact {
  bytes peer = 1;
}

message UnblockContact {
  bytes peer = 1;
}

message SetAlias {
  bytes peer = 1;
  string alias = 2;
}

message DeleteMessage {
  bytes peer = 1;
  bytes msg_id = 2;
}

// Добавление контакта по инвайт-строке molva://add/...
message AddContact {
  string invite = 1;
}

message ListChats {}

message ListMessages {
  bytes peer = 1;
  // Пагинация назад от before_seq; 0 — с конца.
  uint64 before_seq = 2;
  uint32 limit = 3;
}

// Запрос собственной инвайт-строки; alias — предлагаемое имя для
// получателя инвайта (необязательно).
message MyInvite {
  string alias = 1;
}

// Событие ядро → UI.
message Event {
  oneof kind {
    CommandResult command_result = 1;
    MessageReceived message_received = 2;
    MessageDelivered message_delivered = 3;
    PresenceChanged presence_changed = 4;
    ContactRequested contact_requested = 5;
    ContactAccepted contact_accepted = 6;
    FileOffered file_offered = 7;
    FileProgress file_progress = 8;
    FileDone file_done = 9;
    CallEvent call_event = 10;
    MediaPreset media_preset = 11;
  }
}

// Смена ступени качества видео (0 — только аудио, 1..3 — 240/480/720p).
message MediaPreset {
  uint32 level = 1;
}

// Событие звонка: входящий/смена состояния/переустановка пути.
message CallEvent {
  bytes call_id = 1;
  bytes peer = 2;
  State state = 3;
  bool reconnecting = 4;

  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_RINGING_OUT = 1;
    STATE_RINGING_IN = 2;
    STATE_ACTIVE = 3;
    STATE_ENDED = 4;
  }
}

message FileOffered {
  bytes peer = 1;
  bytes file_id = 2;
  string name = 3;
  uint64 size = 4;
}

message FileProgress {
  bytes file_id = 1;
  uint32 have = 2;
  uint32 total = 3;
}

message FileDone {
  bytes file_id = 1;
  string path = 2;
}

// Ответ на Command с тем же id; для запросов — данные внутри.
message CommandResult {
  uint64 id = 1;
  string error = 2; // пустая строка — успех
  oneof data {
    ChatList chats = 3;
    MessageList messages = 4;
    SentMessage sent = 5;
    Invite invite = 6;
  }
}

message ChatList {
  repeated Chat chats = 1;
}

message Chat {
  bytes peer = 1;
  string alias = 2;
  bool online = 3;
  Message last_message = 4;
  State state = 5;

  // Состояние знакомства с пиром.
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_PENDING_OUT = 1; // мы отправили запрос
    STATE_PENDING_IN = 2;  // запрос ждёт нашего решения
    STATE_CONTACT = 3;     // принятый контакт
    STATE_BLOCKED = 4;     // заблокирован
  }
}

message MessageList {
  repeated Message messages = 1;
}

message Message {
  bytes msg_id = 1;
  bytes peer = 2;     // собеседник
  bool outgoing = 3;
  string text = 4;    // пустая, если контент удалён локально
  bool deleted = 5;
  int64 sent_at = 6;  // unix миллисекунды, локальные часы записи
  Status status = 7;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_QUEUED = 1;    // в outbox, пир офлайн
    STATUS_SENT = 2;      // ушло в сеть, ack не получен
    STATUS_DELIVERED = 3; // ack получателя
  }
}

message SentMessage {
  Message message = 1;
}

message Invite {
  string invite = 1; // molva://add/...
}

message MessageReceived {
  Message message = 1;
}

message MessageDelivered {
  bytes peer = 1;
  bytes msg_id = 2;
}

message PresenceChanged {
  bytes peer = 1;
  bool online = 2;
}

message ContactRequested {
  bytes peer = 1;
  string suggested_alias = 2;
}

message ContactAccepted {
  bytes peer = 1;
}
